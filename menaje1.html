<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Artículo con Emergente</title>
    <style>
        /* Fondo oscuro translúcido que cubre la pantalla */
        .modal-fondo {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Opacidad negra */
            z-index: 1000;
        }

        /* La caja del mensaje emergente al centro */
        .modal-contenido {
            background-color: white;
            width: 350px;
            padding: 20px;
            margin: 15% auto; /* Centrado vertical/horizontal aproximado */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .btn-cerrar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Crear Nuevo Artículo</h2>
    
    <form id="formularioArticulo">
        <label>Título del Artículo:</label><br>
        <input type="text" id="titulo" required><br><br>
        <button type="submit">Crear Artículo</button>
    </form>

    <!-- ESTRUCTURA DEL MENSAJE EMERGENTE -->
    <div id="miModal" class="modal-fondo">
        <div class="modal-contenido">
            <h3 style="color: #28a745;">✔ ¡Éxito!</h3>
            <p id="mensajeTexto"></p>
            <button id="btnCerrarModal" class="btn-cerrar">Aceptar</button>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formularioArticulo');
        const modal = document.getElementById('miModal');
        const mensajeTexto = document.getElementById('mensajeTexto');
        const btnCerrar = document.getElementById('btnCerrarModal');

        // Mostrar el mensaje emergente al enviar el formulario
        formulario.addEventListener('submit', function(event) {
            event.preventDefault(); 

            const titulo = document.getElementById('titulo').value;

            // Personalizar el texto y mostrar el modal
            mensajeTexto.textContent = `El artículo "${titulo}" fue creado correctamente.`;
            modal.style.display = 'block'; 

            formulario.reset();
        });

        // Ocultar el mensaje emergente al hacer clic en "Aceptar"
        btnCerrar.addEventListener('click', function() {
            modal.style.display = 'none';
        });
    </script>

</body>
</html>
